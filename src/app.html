<title>Pharmacy Counter Beta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap">
<style id="pagesize">@page{size:A5 portrait;margin:7mm}</style>
<style>
/* Layout: fixed left menu with big buttons, work area on the right; menu becomes a top strip on phones */
:root{
  --bg:#eef3f1; --surface:#ffffff; --fg:#14201c; --muted:#5a6b65; --line:#d5dfdb;
  --accent:#0a7a5c; --accent-fg:#ffffff; --accent-soft:#dff1ea;
  --warn:#9a5b00; --warn-soft:#fdf0d9; --bad:#b8322a; --bad-soft:#fbe4e2;
  --font:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101715; --surface:#18221f; --fg:#e3ece8; --muted:#94a59f; --line:#2c3a35;
  --accent:#3fc29c; --accent-fg:#06140f; --accent-soft:#163329;
  --warn:#f0b357; --warn-soft:#35280f; --bad:#f08279; --bad-soft:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#18221f; --fg:#e3ece8; --muted:#94a59f; --line:#2c3a35;
  --accent:#3fc29c; --accent-fg:#06140f; --accent-soft:#163329;
  --warn:#f0b357; --warn-soft:#35280f; --bad:#f08279; --bad-soft:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
#app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding-left:max(10px,env(safe-area-inset-left,0px))}
.brand{font-weight:700;font-size:17px;padding:4px 10px 14px;display:flex;gap:8px;align-items:center}
.beta{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 5px;margin-top:2px}
.mbeta{display:none}
@media (max-width:820px){.mbeta{display:flex;justify-content:center;gap:6px;align-items:center;font-size:12px;padding:6px;background:var(--warn-soft);color:var(--fg)}}
.brand i{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-style:normal;font-size:18px;line-height:1}
.nav>button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--fg);font:inherit;font-size:15px;font-weight:500;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left}
.nav>button:hover{background:var(--bg)}
.nav>button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.langbtn{margin-top:auto}
.nav kbd{margin-left:auto;font:11px var(--font);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.bk{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;display:grid;gap:6px}
.bk.ok{background:var(--accent-soft)} .bk.warn{background:var(--warn-soft)}
.bk b{font-weight:600}
main{padding-block:22px 60px;padding-left:max(16px,2.2vw);padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1300px;width:100%}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;height:auto;position:sticky;top:0;z-index:5;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px));gap:2px}
  .brand,.bk,.nav kbd{display:none}
  .nav>button{flex-direction:column;gap:2px;font-size:12px;padding:6px 10px;white-space:nowrap}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
h1{font-size:26px;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:21px;margin:0 0 4px;font-weight:700}
h3{font-size:16px;margin:0 0 10px;font-weight:600}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stack{display:grid;gap:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.form .wide{grid-column:span 2}
@media (max-width:500px){.form .wide{grid-column:auto}}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{text-align:right}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{font-size:16px;padding:12px 20px}
.btn.sm{font-size:13px;padding:5px 10px}
.btn.danger{color:var(--bad)}
.btn[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--fg);font:inherit;font-weight:600;padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;font:inherit;color:var(--fg);cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .k{font-size:13px;color:var(--muted);font-weight:500}
.tile .v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:13px;color:var(--muted)}
.tile.warn .v{color:var(--warn)} .tile.bad .v{color:var(--bad)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tr.cancel td{color:var(--muted);text-decoration:line-through}
.t tfoot td{font-weight:700;border-bottom:0}
.t input,.t select{padding:6px 7px;font-size:14px}
.sub{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.banner{background:var(--warn-soft);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.info{background:var(--accent-soft)}
.search input{font-size:17px;padding:12px 14px;border-width:2px}
.results{display:grid;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;overflow:hidden}
.res{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.res.hi,.res:hover{background:var(--accent-soft)}
.res.cat{background:var(--bg)}
.reshead{padding:6px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--bg)}
.res b{font-weight:600}
.res .rt{text-align:right;white-space:nowrap;font-size:13px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.billgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
@media (max-width:1440px) and (min-width:1051px){#cart th,#cart td{padding:7px 4px}#cart td:first-child{min-width:140px}#cart .gc{display:none}}
@media (max-width:1240px) and (min-width:1051px){#cart .dc{display:none}}
@media (max-width:1050px){.billgrid{grid-template-columns:minmax(0,1fr)}}
.totals{display:grid;gap:8px;position:sticky;top:14px}
.tl{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.tl.big{font-size:24px;font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.tl input{width:110px}
.warnrow td{background:var(--bad-soft)}
.x{border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer;padding:0 6px;line-height:1}
.unit{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;cursor:pointer;margin-top:3px}
.unit.on{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.keys{font-size:12px;color:var(--muted)}
.keys kbd{font:11px var(--font);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--surface)}
@media (max-width:640px){
  #cart thead{display:none}
  #cart tbody tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
  #cart tbody tr.warnrow{background:var(--bad-soft)}
  #cart td{border:0;padding:0;min-width:0}
  #cart td.nm{grid-column:1/-1}
  #cart td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}
  #cart input,#cart select{width:100%!important;min-width:0!important}
  #cart td:first-child{min-width:0}
}
#cart select{min-width:0;width:140px}
#cart td.be>*{display:block}
#cart td.be>*+*{margin-top:4px}
#cart td.be .chip{display:inline-block}
#cart td.be input{width:140px}
#cart td.be input[type=month]{font-size:13px}
#cart td:first-child{min-width:170px}
.nmrow{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
#modal{position:fixed;inset:0;background:rgba(10,20,16,.5);z-index:20;display:grid;place-items:start center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);color:var(--fg);border-radius:12px;padding:20px;width:100%;max-width:640px;position:relative;display:grid;gap:14px}
.mbox.wide{max-width:900px}
.mclose{position:absolute;top:8px;right:10px;border:0;background:none;font-size:26px;color:var(--muted);cursor:pointer}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--surface);padding:10px 18px;border-radius:8px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.paper{background:#fff;padding:14px;border-radius:6px;overflow-x:auto}

/* ---------- Printed invoice (A4/A5): always black on white ---------- */
.inv{color:#000;background:#fff;font-family:Arial,Helvetica,sans-serif;font-size:11px;border:1px solid #000;min-width:560px}
.inv .ih{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid #000}
.inv .shop{font-size:18px;font-weight:700}
.inv .ttl{text-align:right;font-weight:700;font-size:15px;white-space:nowrap}
.inv .ttl small{display:block;font-size:10px;font-weight:400}
.inv .im{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;line-height:1.55}
.inv .im .r{text-align:right;white-space:nowrap}
.inv table{width:100%;border-collapse:collapse;font-size:inherit}
.inv .it th{border-top:1px solid #000;border-bottom:1px solid #000;padding:4px 3px;text-align:right;font-size:10px}
.inv .it td{padding:2px 3px;text-align:right;white-space:nowrap}
.inv .it th+th,.inv .it td+td{border-left:1px solid #000}
.inv .it .l{text-align:left;white-space:normal}
.inv .it tr.fill td{height:var(--fh,60px)}
.inv .iw{border-top:1px solid #000;padding:5px 10px;font-weight:700}
.inv .if{display:flex;justify-content:space-between;gap:12px;padding:4px 10px 6px;border-top:1px solid #000}
.inv .gt td,.inv .gt th{padding:1px 6px;text-align:right;font-size:10px}
.inv .gt th{border-bottom:1px solid #000}
.inv .tot{display:grid;grid-template-columns:auto auto;column-gap:14px;line-height:1.6}
.inv .tot span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.inv .tot .g{font-weight:700;font-size:14px}
.inv .is{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:16px 10px 8px;border-top:1px solid #000;font-size:10px}
/* ---------- Thermal receipt ---------- */
.rc{color:#000;background:#fff;font-family:Arial,Helvetica,sans-serif;font-size:11px;width:72mm;padding:2mm;line-height:1.35}
.rc.w58{width:50mm;font-size:10px}
.rc .c{text-align:center}
.rc .sh{font-size:14px;font-weight:700}
.rc hr{border:0;border-top:1px dashed #000;margin:4px 0}
.rc .ln{display:flex;justify-content:space-between;gap:6px}
.rc .ln span:last-child{text-align:right;white-space:nowrap}
.rc .g{font-size:14px;font-weight:700}
.rc .s{font-size:9.5px}
#printArea{display:none}
.dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
@media (max-width:980px){.dash{grid-template-columns:minmax(0,1fr)}}
.sales{display:grid;gap:12px}
.sales .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sales .big{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--muted)}
.delta.up{background:var(--accent-soft);color:var(--accent)} .delta.down{background:var(--warn-soft);color:var(--warn)}
.mini{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)} .mini b{display:block;font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums}
.chart{position:relative}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;height:150px;align-items:end;border-bottom:1px solid var(--line);padding-top:18px}
.bars .col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default}
.bars .bar{width:min(100%,46px);background:var(--accent);opacity:.32;border-radius:4px 4px 0 0;transition:opacity .15s}
.bars .col.today .bar{opacity:1}
.bars .col:hover .bar{opacity:.75}
.bars .val{position:absolute;left:-6px;right:-6px;text-align:center;font-size:11.5px;font-weight:600;padding-bottom:3px;white-space:nowrap}
.blabels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;font-size:11.5px;color:var(--muted);text-align:center;margin-top:5px}
.ctip{position:absolute;pointer-events:none;background:var(--fg);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);z-index:5}
.split{display:grid;gap:12px}
.srow{display:grid;grid-template-columns:76px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.srow .track{display:block;height:10px;border-radius:6px;background:var(--bg);overflow:hidden}
.srow .fill{display:block;height:100%;border-radius:6px;background:var(--accent);min-width:3px}
.srow .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.toplist{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.toplist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.toplist li:last-child{border-bottom:0}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:center}
.tile .ti{grid-row:span 3;width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .ti svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile{min-width:0}.tile .v{overflow-wrap:anywhere}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{display:block;padding:12px}.tile .ti{width:30px;height:30px;margin-bottom:6px}.bars,.blabels{gap:5px}.tile .v{font-size:19px}.tile .s{font-size:12px}.sales .big{font-size:30px}.srow{grid-template-columns:58px minmax(0,1fr) 84px}}
.tile.warn .ti{background:var(--warn-soft);color:var(--warn)} .tile.bad .ti{background:var(--bad-soft);color:var(--bad)}
.card{box-shadow:0 1px 2px rgba(15,40,30,.05)}
.totals .tl.big{background:var(--accent-soft);border-top:0;border-radius:10px;padding:12px 14px;margin-top:4px}
.totals .tl.big span:last-child{color:var(--accent)}
.custinfo .chip{font-size:13px}
.hint{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:11px;font-weight:700;cursor:help;position:relative;margin-left:4px;vertical-align:1px}
.hint:hover::after,.hint:focus::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);width:max-content;max-width:240px;background:var(--fg);color:var(--surface);font-size:12.5px;font-weight:500;line-height:1.4;padding:7px 10px;border-radius:7px;white-space:normal;z-index:30;text-align:left}
.guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.guide .g{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.guide .g b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:14px}
@media (max-width:820px){.guide{grid-template-columns:minmax(0,1fr)}}
.langbtn{font-weight:600}
.morebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
body.large{zoom:1.15}
.check{display:grid;gap:8px}
.ck{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.ck i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;border:2px solid var(--line);flex:none}
.ck.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ck.done span{color:var(--muted);text-decoration:line-through}
.ck .btn{margin-left:auto}
.change{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-weight:600}
.custinfo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.mbar{display:none}
@media (max-width:1050px){.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));justify-content:space-between;align-items:center;gap:10px}
 .mbar b{font-size:22px}}
.welcome{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.welcome button{text-align:left;padding:16px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;display:grid;gap:4px}
.welcome button:hover{border-color:var(--accent)}
.welcome b{font-size:17px}
@media print{
  body{background:#fff}

/* ================= storage: IndexedDB with daily snapshots ================= */
const LEGACY_KEY='pharmacy_counter_v1';

let STATE_KEY='state',SNAP='snap-',cloudStatus={state:'idle',at:null,msg:''},syncT=null,syncing=false;
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('pharmacy_counter',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbReq(mode,fn){return new Promise((res,rej)=>{const tx=idb.transaction('kv',mode),r=fn(tx.objectStore('kv'));let out;if(r)r.onsuccess=()=>out=r.result;tx.oncomplete=()=>res(out);tx.onerror=tx.onabort=()=>rej(tx.error)})}
const idbGet=k=>idbReq('readonly',s=>s.get(k));
const idbSet=(k,v)=>idbReq('readwrite',s=>s.put(v,k));
const idbDel=k=>idbReq('readwrite',s=>s.delete(k));
const idbKeys=()=>idbReq('readonly',s=>s.getAllKeys());
let chain=Promise.resolve(),bkT;
function save(){
  S.updated=Date.now();
  if(window.__lastSync&&S.sync!==window.__lastSync)S.sync={...window.__lastSync}; // keep cloud position when records are replaced (restore, wipe)
  S.sync=S.sync||{};S.sync.dirty=true;window.__lastSync=S.sync;
  if(CLOUD){clearTimeout(syncT);syncT=setTimeout(cloudSync,6000)}
  chain=chain.then(()=>idb?idbSet(STATE_KEY,S):localStorage.setItem(LEGACY_KEY,JSON.stringify(S)))
    .catch(e=>{console.error(e);toast('Could not save. Download a backup from Settings now.')});
  clearTimeout(bkT);bkT=setTimeout(autoBackup,3000);
}
async function snapshotToday(){
  if(!idb)return;const keys=(await idbKeys()).map(String),k=SNAP+today();
  if(!keys.includes(k))await idbSet(k,S);
  const snaps=keys.concat(k).filter(x=>x.startsWith(SNAP)).sort();
  for(const old of [...new Set(snaps)].slice(0,-7))await idbDel(old);
}
async function markBackup(){lastBackup=new Date().toISOString();if(idb)try{await idbSet(STATE_KEY+':lastBackup',lastBackup)}catch(e){}drawNav()}
async function writeBackupFile(){const fh=await dirHandle.getFileHandle(`pharmacy-backup-${today()}.json`,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(S));await w.close();await markBackup()}
async function autoBackup(){
  if(!dirHandle)return;
  try{const p=await dirHandle.queryPermission({mode:'readwrite'});if(p!=='granted'){backupState='paused';drawNav();return}
    await writeBackupFile();backupState='on'}catch(e){backupState='paused'}
  drawNav();
}

function hiText(t){const k=t.trim();if(!k)return null;if(HI[k])return t.replace(k,HI[k]);for(const[r,v]of HI_RE)if(r.test(k))return t.replace(k,k.replace(r,v));return null}
function translateNode(root){
  if(!S||S.settings.lang!=='hi'||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&!n.parentElement.closest('script,style,.inv,.rc,#printArea,[data-nohi]')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const todo=[];while(w.nextNode())todo.push(w.currentNode);
  for(const n of todo){const v=hiText(n.nodeValue);if(v!==null&&v!==n.nodeValue)n.nodeValue=v}
  if(root.querySelectorAll)root.querySelectorAll('[placeholder],[title]').forEach(el=>{for(const a of HI_ATTR){const v=el.getAttribute(a);if(v&&HI[v.trim()])el.setAttribute(a,HI[v.trim()])}});
}
let hiObs=null;
function applyLang(){
  document.documentElement.lang=S.settings.lang==='hi'?'hi':'en';
  if(S.settings.lang==='hi'){translateNode(document.body);if(!hiObs){hiObs=new MutationObserver(ms=>{if(S.settings.lang!=='hi')return;for(const m of ms){m.addedNodes.forEach(n=>{if(n.nodeType===1)translateNode(n);else if(n.nodeType===3&&n.parentElement){const v=hiText(n.nodeValue);if(v!==null&&v!==n.nodeValue)n.nodeValue=v}});if(m.type==='characterData'){}}});hiObs.observe(document.body,{childList:true,subtree:true})}}
}

/* ================= cloud sync (Supabase) ================= */
const MERGE_ARRAYS=['meds','batches','parties','sales','returns','purchases','payments'];
function mergeStates(a,b){ // a, b = two versions; newer one wins on the same record
  const newer=(+a.updated||0)>=(+b.updated||0)?a:b,older=newer===a?b:a,out=JSON.parse(JSON.stringify(newer));
  for(const k of MERGE_ARRAYS){const have=new Set((out[k]||[]).map(x=>x.id));for(const x of (older[k]||[]))if(x&&x.id&&!have.has(x.id))(out[k]=out[k]||[]).push(x)}
  const lk=new Set((out.log||[]).map(e=>e.t+e.text));for(const e of (older.log||[]))if(!lk.has(e.t+e.text))(out.log=out.log||[]).push(e);
  (out.log||[]).sort((x,y)=>x.t.localeCompare(y.t));
  out.settings.nextNo=Math.max(+a.settings.nextNo||1,+b.settings.nextNo||1);out.settings.cnNo=Math.max(+a.settings.cnNo||1,+b.settings.cnNo||1);
  out.sample=!!(a.sample&&b.sample);return out;
}
function setCloud(state,msg){cloudStatus={state,at:state==='ok'?new Date():cloudStatus.at,msg:msg||''};drawNav()}
function packForCloud(){const c=JSON.parse(JSON.stringify(S));delete c.sync;return c}
async function cloudSync(force){
  if(!CLOUD||!S||syncing)return;if(!force&&!(S.sync&&S.sync.dirty))return;
  if(!navigator.onLine){setCloud('offline');return}
  syncing=true;setCloud('saving');
  try{
    const remoteAt=await PCCloud.getShopUpdated();
    if(remoteAt&&(!S.sync.at||Date.parse(remoteAt)>Date.parse(S.sync.at))){
      const r=await PCCloud.getShopData();
      if(r&&r.data&&r.data.meds){const keepSync=S.sync;S=mergeStates(S,r.data);S.sync=keepSync;migrate();if(view!=='bill')render();toast('Changes from your other device were added.')}
    }
    S.sync.dirty=false;
    const at=await PCCloud.putShopData(packForCloud(),navigator.userAgent.slice(0,80));
    S.sync.at=at;
    if(S.sync.backupDay!==today()){try{await PCCloud.putBackup(today(),packForCloud());S.sync.backupDay=today()}catch(e){}}
    const bc=S.sales.filter(x=>!x.cancelled).length;if(!S.sync.statsAt||S.sync.statsBills!==bc||Date.now()-S.sync.statsAt>6e5){try{await PCCloud.updateProfile({last_seen:new Date().toISOString(),bills_count:S.sales.filter(x=>!x.cancelled).length,meds_count:S.meds.length,app_version:'beta-2',shop_name:S.settings.shop,phone:S.settings.phone});S.sync.statsAt=Date.now();S.sync.statsBills=bc}catch(e){}}
    await (chain=chain.then(()=>idbSet(STATE_KEY,S)));
    lastBackup=new Date().toISOString();setCloud('ok');
  }catch(e){
    S.sync.dirty=true;
    if(e&&e.status===401){setCloud('login','Please log in again to keep saving to the cloud.')}
    else setCloud('error',e&&e.status===0?'No internet. Saved on this computer; will sync when online.':'Could not save to the cloud. Will retry.');
    clearTimeout(syncT);syncT=setTimeout(cloudSync,60000);
  }finally{syncing=false}
}
window.addEventListener('online',()=>cloudSync(true));
window.addEventListener('offline',()=>{if(CLOUD)setCloud('offline')});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&CLOUD&&S&&S.sync&&S.sync.dirty)cloudSync()});
window.addEventListener('beforeunload',e=>{if(CLOUD&&S&&S.sync&&S.sync.dirty&&navigator.onLine){cloudSync();e.preventDefault();e.returnValue=''}});
function cloudBox(){
  const u=PCCloud.user()||{},st=cloudStatus.state,t=cloudStatus.at?cloudStatus.at.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
  const line={ok:`Saved to cloud ${t}`,saving:'Saving to cloud…',offline:'Offline · saved on this device',error:cloudStatus.msg,login:cloudStatus.msg,idle:S&&S.sync&&S.sync.dirty?'Waiting to sync':(t?`Saved to cloud ${t}`:'Connected')}[st]||'';
  const cls=st==='ok'||st==='idle'?'ok':'warn';
  return`<div class="bk ${cls}"><span><b title="${esc(u.email||'')}">${esc((u.email||'').split('@')[0])}</b><br>${esc(line)}</span><span class="row" style="gap:6px">${st==='login'?'<a class="btn sm pri" href="../login.html?next=app">Log in</a>':'<button class="btn sm" data-act="syncNow">Sync now</button>'}<button class="btn sm" data-act="logout">Log out</button></span></div>`;
}

function blankState(){return{v:2,settings:{shop:'My Medical Store',addr:'Main Bazar, Mansa, Punjab',phone:'98XXXXXXXX',gstin:'',dl:'',gstType:'regular',prefix:'INV-',nextNo:1,cnNo:1,
  footer:'Get well soon. Medicines once sold are taken back only with the bill within 7 days.',title:'auto',paper:'A5'},
  meds:[],batches:[],parties:[],sales:[],returns:[],purchases:[],payments:[],log:[],sample:false}}
function migrate(){
  const st=S.settings;st.gstType=st.gstType||'regular';st.stock=st.stock||'track';st.cnNo=st.cnNo||1;
  S.returns=S.returns||[];S.log=S.log||[];
  S.meds.forEach(m=>{if(m.units==null)m.units=guessUnits(m.pack);m.salt=m.salt||'';m.barcode=m.barcode||'';m.sched=m.sched||''});
  S.sales.forEach(s=>s.items.forEach(i=>{if(i.sched==null){const m=S.meds.find(x=>x.id===i.medId);i.sched=m?m.sched:''}}));
  S.v=2;
}

const med=id=>S.meds.find(m=>m.id===id);
const bat=id=>S.batches.find(b=>b.id===id);
const party=id=>S.parties.find(p=>p.id===id);
const stockOf=id=>r4(S.batches.filter(b=>b.medId===id).reduce((a,b)=>a+(+b.qty||0),0));
function fmtStock(q,m){q=r4(q);if(!m||m.units<=1||Number.isInteger(q))return String(q);const f=Math.floor(q),l=Math.round((q-f)*m.units);return l?`${f} + ${l} ${unitWord(m)}`:String(f)}
function nearestExp(id){const e=S.batches.filter(b=>b.medId===id&&b.qty>0).map(b=>b.exp).sort();return e[0]||''}

function lineAmt(it){return(+it.qty||0)*(+it.rate||0)*(1-(+it.disc||0)/100)}
function saleTotals(items,disc){
  const sub=items.reduce((a,i)=>a+lineAmt(i),0);disc=Math.min(Math.max(+disc||0,0),sub);
  const raw=sub-disc,total=Math.round(raw),f=sub?raw/sub:1,g={};
  items.forEach(i=>{const amt=lineAmt(i)*f,tx=amt/(1+(+i.gst||0)/100),k=+i.gst||0;g[k]=g[k]||{tx:0,tax:0};g[k].tx+=tx;g[k].tax+=amt-tx});
  return{sub,disc,raw,total,ro:total-raw,gst:g};
}
function purLine(r){const base=(+r.qty||0)*(+r.pur||0)*(1-(+r.disc||0)/100);return{base,tax:base*(+r.gst||0)/100}}
const saleFactor=s=>s.sub?(s.sub-s.disc)/s.sub:1;
const returnedQty=(s,idx)=>S.returns.filter(r=>r.saleId===s.id).reduce((a,r)=>a+r.items.filter(i=>i.idx===idx).reduce((x,i)=>x+i.qty,0),0);
function balance(p){
  let b=+p.opening||0;
  if(p.type==='customer'){S.sales.filter(s=>s.partyId===p.id&&!s.cancelled).forEach(s=>b+=s.total-(+s.paid||0));
    S.returns.filter(r=>r.partyId===p.id&&r.mode==='credit').forEach(r=>b-=r.total)}
  else S.purchases.filter(x=>x.partyId===p.id).forEach(x=>b+=x.total-(+x.paid||0));
  S.payments.filter(x=>x.partyId===p.id).forEach(x=>b-=+x.amount||0);
  return r2(b);
}
function words(num){
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],
        b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");
  const three=n=>(n>=100?a[Math.floor(n/100)]+" Hundred"+(n%100?" and ":""):"")+(n%100?two(n%100):"");
  let n=Math.floor(Math.abs(num)),out=[];if(n===0)out.push("Zero");
  const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)out.push(three(cr)+" Crore");if(lk)out.push(two(lk)+" Lakh");if(th)out.push(two(th)+" Thousand");if(n)out.push(three(n));
  return"Rs. "+out.join(" ")+" only";
}

function lowStock(){return S.meds.filter(m=>{const s=stockOf(m.id);return s<=0||(+m.min&&s<=+m.min)})}
function maxBillNo(prefix){return S.sales.filter(s=>s.no.startsWith(prefix)).reduce((a,s)=>Math.max(a,parseInt(s.no.slice(prefix.length))||0),0)}

let CAT=null,catNorm=null,catSaltNorm=null,catLoading=null;
function loadCatalog(){if(catLoading)return catLoading;catLoading=(async()=>{try{const el=$('#catalog');const b64=el?el.textContent.trim():'';if(b64.length<100||!window.DecompressionStream)return null;
  const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  CAT=JSON.parse(txt);catNorm=CAT.r.map(r=>norm(r[0]));catSaltNorm=CAT.c.map(c=>norm(c));if(view==='bill'&&$('#medsearch')&&$('#medsearch').value)drawResults();return CAT}catch(e){console.error(e);return null}})();return catLoading}
const catItem=r=>({name:r[0],company:CAT.m[r[1]]||'',pack:r[2],units:r[3]||1,salt:CAT.c[r[4]]||'',mrp:r[5]||0});
function catSearch(q,limit=8,skip=new Set()){if(!CAT)return[];const nq=norm(q);if(nq.length<2)return[];const a=[],b=[],c=[];
  for(let i=0;i<catNorm.length&&a.length<limit;i++){const n=catNorm[i];if(skip.has(n))continue;if(n.startsWith(nq))a.push(i);else if(b.length<limit&&n.includes(nq))b.push(i)}
  if(a.length+b.length<limit&&nq.length>=4){const salts=new Set();catSaltNorm.forEach((s,i)=>{if(s.includes(nq))salts.add(i)});for(let i=0;i<CAT.r.length&&c.length<limit;i++)if(salts.has(CAT.r[i][4])&&!skip.has(catNorm[i]))c.push(i)}
  return[...a,...b,...c].slice(0,limit).map(i=>catItem(CAT.r[i]))}
function catFind(name){if(!CAT)return null;const n=norm(name),i=catNorm.indexOf(n);return i<0?null:catItem(CAT.r[i])}
function fillNameList(q){const dl=$('#catlist');if(!dl)return;const nq=norm(q);if(nq.length<2){dl.innerHTML='';return}
  const own=S.meds.filter(m=>norm(m.name).includes(nq)).slice(0,8).map(m=>m.name),skip=new Set(own.map(norm));
  dl.innerHTML=[...own,...catSearch(q,12,skip).map(c=>c.name)].map(n=>`<option value="${esc(n)}">`).join('')}

   <section class="card stack" style="gap:16px"><div><h3 style="margin-bottom:12px">Money in, last 7 days</h3><div class="split">${srow('Cash',cash)}${srow('UPI',upi)}${srow('Udhaar',udh)}</div></div>

  </div>`;

function searchMeds(q){
  const nq=norm(q);if(!nq)return[];
  const out=[];
  for(const m of S.meds){
    const nn=norm(m.name);let sc=0,why='';
    if(m.barcode&&m.barcode===q.trim()){sc=10}
    else if(nn.startsWith(nq))sc=4;
    else if(nn.includes(nq))sc=3;
    else if(norm(m.salt).includes(nq)){sc=2;why='salt'}
    else if(norm(m.company).includes(nq))sc=1.5;
    else{let i=0;for(const ch of nn){if(ch===nq[i])i++;if(i===nq.length)break}if(i===nq.length&&nq.length>=3)sc=1}
    if(sc)out.push({m,sc,why});
  }
  return out.sort((a,b)=>b.sc-a.sc||(stockOf(b.m.id)>0)-(stockOf(a.m.id)>0)||a.m.name.localeCompare(b.m.name)).slice(0,8);
}

function rowState(it){

  if(!bad&&b&&+it.rate*(1-(+it.disc||0)/100)<(it.loose?b.pur/(m.units||1):b.pur)-0.005)notes.push('Below purchase cost');
  return{bad,note:notes.join(' · ')};
}

function cartInput(e){

function saveBill(print){
  if(!bill.items.length)return toast('Add at least one medicine to the bill.');
  if(bill.date>today())return toast('The bill date cannot be in the future.');
  for(const it of bill.items){const m=med(it.medId),b=bat(it.batchId);
    if(it.nostock){if(!m)return toast('A medicine on this bill no longer exists. Remove it and add again.');if(!(+it.qty>0))return toast(`Enter a quantity for ${m.name}.`);
      if(!(+it.mrp>0))return toast(`Enter the MRP for ${m.name}.`);if(+it.rate>+it.mrp+0.005)return toast(`${m.name}: rate is above MRP. Selling above MRP is not allowed.`);
      if((m.sched==='H1'||m.sched==='X')&&(!bill.doctor.trim()||!bill.name.trim()))return toast(`${m.name} is Schedule ${m.sched}. Enter the patient and doctor name.`);continue}
    if(!m||!b)return toast('A medicine or batch on this bill no longer exists. Remove it and add again.');
    if(!(+it.qty>0)||(it.loose&&!Number.isInteger(+it.qty)))return toast(`Enter a whole-number quantity for ${m.name}.`);
    if(+it.rate>+it.mrp+0.005)return toast(`${m.name}: rate ₹${n2(it.rate)} is above MRP ₹${n2(it.mrp)}. Selling above MRP is not allowed.`);
    if(+it.disc<0||+it.disc>100)return toast(`${m.name}: discount must be between 0 and 100%.`);
    if((m.sched==='H1'||m.sched==='X')&&!bill.doctor.trim())return toast(`${m.name} is Schedule ${m.sched}. Enter the doctor's name.`);
    if((m.sched==='H1'||m.sched==='X')&&!bill.name.trim())return toast(`${m.name} is Schedule ${m.sched}. Enter the patient's name for the register.`)}
  const name=bill.name.trim();let p=null;

  const old=bill.editOld?S.sales.find(s=>s.id===bill.editId):null;
  if(old)old.items.forEach(i=>{const b=bat(i.batchId);if(b)b.qty=r4(b.qty+packs(i))});
  const t=saleTotals(bill.items,bill.disc),paid=bill.type==='Credit'?Math.min(Math.max(+bill.paid||0,0),t.total):t.total;

  const sale={id:old?old.id:uid(),no:old?old.no:S.settings.prefix+pad(S.settings.nextNo),date:bill.date||today(),partyId:p?p.id:null,name:name||'Walk-in',phone:bill.phone.trim(),doctor:bill.doctor.trim(),type:bill.type,
    disc:t.disc,sub:t.sub,ro:t.ro,total:t.total,paid,prevBal:prev,gst:t.gst,
    items:bill.items.map(it=>{const m=med(it.medId),b=bat(it.batchId);
      if(it.nostock){if(!it.loose&&+it.mrp!==+m.mrp)m.mrp=+it.mrp;return{medId:m.id,batchId:null,nostock:true,name:m.name,pack:m.pack,hsn:m.hsn,sched:m.sched,batch:(it.batchTxt||'').toUpperCase(),exp:it.exp||'',qty:+it.qty,loose:!!it.loose,units:m.units||1,unitName:unitWord(m),mrp:+it.mrp,rate:+it.rate,disc:+it.disc||0,gst:+it.gst,pur:0}}
      const pk=packs({...it,units:m.units});b.qty=r4(b.qty-pk);
      return{medId:m.id,batchId:b.id,name:m.name,pack:m.pack,hsn:m.hsn,sched:m.sched,batch:b.batch,exp:b.exp,qty:+it.qty,loose:!!it.loose,units:m.units||1,unitName:unitWord(m),mrp:+it.mrp,rate:+it.rate,disc:+it.disc||0,gst:+it.gst,pur:+b.pur||0}})};
  if(old){S.sales[S.sales.indexOf(old)]=sale;logEv(`Bill ${sale.no} edited (was ${money(old.total)}, now ${money(sale.total)})`)}
  else{S.sales.push(sale);S.settings.nextNo++;S.settings.guideDone=true}
  save();bill=newBill();render();toast(`Saved bill ${sale.no} for ${money(sale.total)}.`);

}

function saveMed(id){

      b.batch=r.batch.toUpperCase()||b.batch;b.exp=r.exp||b.exp;b.qty=r4(+r.qty||0);b.pur=+r.pur||0;b.sale=+r.sale||m.mrp;b.mrp=m.mrp}

async function inflateRaw(data){return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
async function readXlsx(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();let e=buf.byteLength-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('not-xlsx');
  const n=dv.getUint16(e+10,true);let off=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){const nl=dv.getUint16(off+28,true),xl=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true);
    files[td.decode(u8.subarray(off+46,off+46+nl))]={method:dv.getUint16(off+10,true),csize:dv.getUint32(off+20,true),lho:dv.getUint32(off+42,true)};off+=46+nl+xl+cl}
  const get=async name=>{const f=files[name];if(!f)return null;const l=f.lho,s0=l+30+dv.getUint16(l+26,true)+dv.getUint16(l+28,true),d=u8.subarray(s0,s0+f.csize);return td.decode(f.method===0?d:await inflateRaw(d))};
  const P=x=>new DOMParser().parseFromString(x,'application/xml');
  const ss=[],sx=await get('xl/sharedStrings.xml');if(sx)P(sx).querySelectorAll('si').forEach(si=>ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')));
  let path='xl/worksheets/sheet1.xml';
  try{const wb=P(await get('xl/workbook.xml')),sh=wb.getElementsByTagName('sheet')[0],rid=sh.getAttribute('r:id'),rel=[...P(await get('xl/_rels/workbook.xml.rels')).getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
    if(rel){const t=rel.getAttribute('Target');path=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,'')}}catch(x){}
  const sheetXml=await get(path);if(!sheetXml)throw new Error('no-sheet');
  const col=ref=>{let c=0;for(const ch of ref.replace(/\d+/g,''))c=c*26+(ch.charCodeAt(0)-64);return c-1};
  const rows=[];for(const row of P(sheetXml).getElementsByTagName('row')){const a=[];for(const c of row.getElementsByTagName('c')){const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val=v?v.textContent:'';
      if(t==='s')val=ss[+val]||'';else if(t==='inlineStr'){const is=c.getElementsByTagName('t')[0];val=is?is.textContent:''}a[col(c.getAttribute('r')||'A')]=val}rows.push(Array.from(a,x=>x??''))}
  return rows;
}
function parseCsv(text){const rows=[];let row=[],f='',q=false;const sep=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(f);f=''}else if(ch==='\n'){row.push(f.replace(/\r$/,''));rows.push(row);row=[];f=''}else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseExpiry(v){v=String(v||'').trim();if(!v)return'';let m;const pm=(y,mo)=>{y=+y;if(y<100)y+=2000;return mo>=1&&mo<=12&&y>2000&&y<2100?`${y}-${String(mo).padStart(2,'0')}`:''};
  if(/^\d{5}(\.\d+)?$/.test(v)){const d=new Date(Math.round((+v-25569)*864e5));return pm(d.getUTCFullYear(),d.getUTCMonth()+1)}
  if(m=v.match(/^(\d{4})[-\/.](\d{1,2})/))return pm(m[1],+m[2]);
  if(m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))return pm(m[3],+m[2]);
  if(m=v.match(/^(\d{1,2})[-\/. ](\d{2,4})$/))return pm(m[2],+m[1]);
  if(m=v.match(/^([a-z]{3})[a-z]*[-\/. ']*(\d{2,4})$/i))return pm(m[2],MON[m[1].toLowerCase()]);
  return''}
const IMP_FIELDS=[['name','Medicine name',1,['item','product','medicine','name','description','particular','itemname','productname']],['qty','Quantity (packs)',0,['qty','quantity','stock','closing','balance','bal','qnty','clqty','clstock']],
  ['batch','Batch',0,['batch','batchno','bno']],['exp','Expiry',0,['exp','expiry','expdate','expirydate']],['mrp','MRP',0,['mrp']],['pur','Purchase rate',0,['purchase','purrate','prate','cost','ptr','rate']],
  ['gst','GST %',0,['gst','tax','igst','gstrate']],['hsn','HSN',0,['hsn','hsncode']],['company','Company',0,['company','mfg','mfr','manufacturer','make','mfgby']],['pack','Pack',0,['pack','packing','unit','pck']]];
let IMP=null;
function guessMap(head){const used=new Set(),map={};const h=head.map(x=>norm(x));
  for(const[k,,, syn]of IMP_FIELDS){let idx=h.findIndex((x,i)=>!used.has(i)&&syn.some(s=>x===s));if(idx<0)idx=h.findIndex((x,i)=>!used.has(i)&&x&&syn.some(s=>x.startsWith(s)||x.includes(s)));if(idx>=0){map[k]=idx;used.add(idx)}else map[k]=-1}return map}
function importFormHTML(){return`<h2>Import your stock</h2><p class="note">Upload your stock list from Marg, Excel or any software. Save it as <b>.xlsx</b> or <b>.csv</b> (old .xls files: open in Excel and "Save As" .xlsx). Only the medicine name is required; everything else is optional.</p>
  <div class="row"><label class="btn pri" style="display:inline-block">Choose file<input id="impfile" type="file" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></label><button class="btn" data-act="impTemplate">Download sample sheet</button></div>
  <div id="impbody"></div>`}
function drawImport(){const el=$('#impbody');if(!el||!IMP)return;const{head,data,map}=IMP;
  const opt=k=>`<select data-impk="${k}" id="im_${k}"><option value="-1">— not in file —</option>${head.map((h,i)=>`<option value="${i}" ${map[k]===i?'selected':''}>${esc(h||'Column '+(i+1))}</option>`).join('')}</select>`;
  const rows=impRows();const nm=rows.filter(r=>r.name).length;
  el.innerHTML=`<h3>Match your columns</h3><p class="note">We matched these automatically. Fix any that are wrong. ${data.length} rows found.</p>
  <div class="form">${IMP_FIELDS.map(([k,l,req])=>`<label>${l}${req?' *':''}${opt(k)}</label>`).join('')}</div>
  <h3>Preview</h3><div class="tw"><table class="t"><thead><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th class="r">Qty</th><th class="r">MRP</th><th class="r">Pur. rate</th><th class="r">GST</th></tr></thead><tbody>${rows.slice(0,6).map(r=>`<tr><td>${esc(r.name)}${r.cat?' <span class="chip">matched</span>':''}</td><td>${esc(r.batch)}</td><td>${r.exp?expF(r.exp):'<span class="sub">—</span>'}</td><td class="r">${r.qty}</td><td class="r">${n2(r.mrp)}</td><td class="r">${n2(r.pur)}</td><td class="r">${r.gst}%</td></tr>`).join('')}</tbody></table></div>
  <p class="note">${rows.filter(r=>r.cat).length} of ${nm} names matched the medicine database (company, salt and pack are filled from it). Rows without a GST % get 5%. Rows with the same medicine and batch already in your shop get their quantity replaced.</p>
  <div class="mfoot"><button class="btn pri big" data-act="impGo">Import ${nm} rows</button></div>`;
  el.querySelectorAll('[data-impk]').forEach(s=>s.addEventListener('change',()=>{IMP.map[s.dataset.impk]=+s.value;drawImport()}))}
function impRows(){const{data,map}=IMP,g=(r,k)=>map[k]>=0?String(r[map[k]]??'').trim():'',num=v=>{const x=parseFloat(String(v).replace(/[^\d.\-]/g,''));return isFinite(x)?x:0};
  return data.map(r=>{const name=g(r,'name').toUpperCase().replace(/\s+/g,' ');const c=name?catFind(name):null;const gs=g(r,'gst')===''?5:num(g(r,'gst'));
    return{name,batch:g(r,'batch').toUpperCase(),exp:parseExpiry(g(r,'exp')),qty:Math.max(0,num(g(r,'qty'))),mrp:num(g(r,'mrp'))||(c?c.mrp:0),pur:num(g(r,'pur')),gst:[0,5,12,18].includes(gs)?gs:5,hsn:g(r,'hsn')||'3004',company:g(r,'company')||(c?c.company:''),pack:g(r,'pack')||(c?c.pack:''),cat:c}})}
async function loadImportFile(f){
  try{let rows;if(/\.csv$/i.test(f.name))rows=parseCsv(await f.text());else if(/\.xlsx$/i.test(f.name))rows=await readXlsx(await f.arrayBuffer());
    else return toast('Please save the file as .xlsx or .csv and try again.');
    rows=rows.filter(r=>r.some(c=>String(c).trim()));if(rows.length<2)return toast('The file looks empty.');
    let hi=0,best=-1;rows.slice(0,10).forEach((r,i)=>{const m=guessMap(r),sc=Object.values(m).filter(x=>x>=0).length;if(sc>best){best=sc;hi=i}});
    const head=rows[hi].map(String);IMP={head,data:rows.slice(hi+1),map:guessMap(head)};
    if(IMP.map.name<0)IMP.map.name=0;await loadCatalog();drawImport()}
  catch(e){console.error(e);toast('Could not read that file. Save it as .xlsx or .csv from Excel and try again.')}}

function gstOfReturn(r){const s=S.sales.find(x=>x.id===r.saleId),g={};if(!s)return g;r.items.forEach(ri=>{const it=s.items[ri.idx];if(!it)return;const tx=ri.amt/(1+it.gst/100),k=it.gst;g[k]=g[k]||{tx:0,tax:0};g[k].tx+=tx;g[k].tax+=ri.amt-tx});return g}
function drawReport(){
  let h='';
  if(rtab==='sales'){const l=S.sales.filter(s=>inRange(s.date)).reverse(),ok=l.filter(s=>!s.cancelled);
    const profit=ok.reduce((a,s)=>a+s.items.reduce((x,i)=>{const amt=lineAmt(i)*saleFactor(s);return x+amt/(1+i.gst/100)-(i.pur||0)*packs(i)},0),0);
    const sum=t=>ok.filter(s=>s.type===t).reduce((a,s)=>a+s.total,0);
    h=`<p class="note">${ok.length} bills · Sales ${money(ok.reduce((a,s)=>a+s.total,0))} · Cash ${money(sum('Cash'))} · UPI ${money(sum('UPI'))} · Credit ${money(sum('Credit'))} · Approx. profit ${money(profit)} (before tax, before returns)</p>
    ${l.length?`<div class="tw"><table class="t"><thead><tr><th>Bill no.</th><th>Date</th><th>Customer</th><th>Type</th><th class="r">Total</th><th class="r">Paid</th><th></th></tr></thead><tbody>${l.map(s=>`<tr class="${s.cancelled?'cancel':''}"><td>${esc(s.no)}</td><td>${dmy(s.date)}</td><td>${esc(s.name)}</td><td>${s.cancelled?'Cancelled':s.type}${S.returns.some(r=>r.saleId===s.id)?' <span class="chip warn">Return</span>':''}</td><td class="r">${n2(s.total)}</td><td class="r">${n2(s.paid)}</td>
     <td class="r"><button class="btn sm" data-act="viewBill" data-id="${s.id}">Open</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No bills in these dates.</div>'}`}
  if(rtab==='day'){const d=rto,ss=S.sales.filter(s=>s.date===d&&!s.cancelled),sum=t=>ss.filter(s=>s.type===t).reduce((a,s)=>a+s.total,0);
    const creditPaidNow=ss.filter(s=>s.type==='Credit').reduce((a,s)=>a+(+s.paid||0),0);
    const custPays=S.payments.filter(x=>x.date===d&&(party(x.partyId)||{}).type==='customer'),suppPays=S.payments.filter(x=>x.date===d&&(party(x.partyId)||{}).type==='supplier');
    const byMode=(arr,m)=>arr.filter(x=>x.mode===m).reduce((a,x)=>a+(+x.amount||0),0);
    const refunds=S.returns.filter(r=>r.date===d&&r.mode==='cash').reduce((a,r)=>a+r.total,0);
    const purCash=S.purchases.filter(p=>p.date===d).reduce((a,p)=>a+(+p.paid||0),0);
    const cashIn=sum('Cash')+creditPaidNow+byMode(custPays,'Cash'),cashOut=refunds+byMode(suppPays,'Cash')+purCash;
    const L=(k,v,b)=>`<tr><td>${b?'<b>'+k+'</b>':k}</td><td class="r">${b?'<b>'+money(v)+'</b>':money(v)}</td></tr>`;
    h=`<h3>Day close for ${dmy(d)} · ${ss.length} bills</h3><div class="two"><div class="tw"><table class="t"><tbody>
      ${L('Cash bills',sum('Cash'))}${L('Paid now on credit bills',creditPaidNow)}${L('Udhaar collected in cash',byMode(custPays,'Cash'))}${L('Cash refunds for returns',-refunds)}${L('Paid to suppliers in cash',-(byMode(suppPays,'Cash')+purCash))}${L('Cash in drawer should be (plus your opening cash)',cashIn-cashOut,1)}
     </tbody></table></div><div class="tw"><table class="t"><tbody>
      ${L('UPI bills',sum('UPI'))}${L('Udhaar collected by UPI / bank',byMode(custPays,'UPI')+byMode(custPays,'Bank')+byMode(custPays,'Cheque'))}${L('New udhaar given',sum('Credit')-creditPaidNow)}${L('Total sales',ss.reduce((a,s)=>a+s.total,0),1)}
     </tbody></table></div></div><p class="note">Pick the day with the "To" date above. Count your drawer and compare it with the first table.</p>`}
  if(rtab==='returns'){const l=S.returns.filter(r=>inRange(r.date)).reverse();
    h=l.length?`<div class="tw"><table class="t"><thead><tr><th>Credit note</th><th>Date</th><th>Bill</th><th>Customer</th><th>Refund</th><th class="r">Amount</th></tr></thead><tbody>${l.map(r=>`<tr><td>${esc(r.no)}</td><td>${dmy(r.date)}</td><td>${esc(r.saleNo)}</td><td>${esc(r.name)}</td><td>${r.mode==='cash'?'Cash refund':'Reduced udhaar'}</td><td class="r">${n2(r.total)}</td></tr>`).join('')}</tbody>
     <tfoot><tr><td>Total</td><td></td><td></td><td></td><td></td><td class="r">${n2(l.reduce((a,r)=>a+r.total,0))}</td></tr></tfoot></table></div>`:'<div class="empty">No returns in these dates. Open a bill and press "Return items" to make one.</div>'}
  if(rtab==='purch'){const l=S.purchases.filter(p=>inRange(p.date)).reverse();
    h=l.length?`<div class="tw"><table class="t"><thead><tr><th>Date</th><th>Supplier</th><th>Bill no.</th><th class="r">Items</th><th class="r">Taxable</th><th class="r">GST</th><th class="r">Total</th></tr></thead><tbody>${l.map(p=>`<tr><td>${dmy(p.date)}</td><td>${esc((party(p.partyId)||{}).name)}</td><td>${esc(p.inv)}</td><td class="r">${p.rows.length}</td><td class="r">${n2(p.base)}</td><td class="r">${n2(p.tax)}</td><td class="r">${n2(p.total)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td></td><td></td><td></td><td class="r">${n2(l.reduce((a,p)=>a+p.base,0))}</td><td class="r">${n2(l.reduce((a,p)=>a+p.tax,0))}</td><td class="r">${n2(l.reduce((a,p)=>a+p.total,0))}</td></tr></tfoot></table></div>`:'<div class="empty">No purchases in these dates.</div>'}
  if(rtab==='gst'){
    const ss=S.sales.filter(s=>inRange(s.date)&&!s.cancelled),rs=S.returns.filter(r=>inRange(r.date));
    if(!gstOn()){const turn=ss.reduce((a,s)=>a+s.total,0)-rs.reduce((a,r)=>a+r.total,0);
      h=`<p style="font-size:17px;margin:0">Turnover for these dates: <b>${money(turn)}</b></p><p class="note">${S.settings.gstType==='composition'?'You are set as a composition dealer: you pay tax on turnover each quarter (CMP-08) and do not charge GST on bills. The rate for traders is usually 1%; confirm with your CA.':'You are set as not registered for GST, so no GST is charged or reported. Change this in Settings if you register.'}</p>`}
    else{
    const add=(o,g,sign)=>Object.entries(g||{}).forEach(([r,v])=>{o[r]=o[r]||{tx:0,tax:0};o[r].tx+=sign*v.tx;o[r].tax+=sign*v.tax});
    const b2c={},pi={},b2b=[];
    ss.forEach(s=>{const p=party(s.partyId);if(p&&p.gstin)b2b.push({s,p});else add(b2c,s.gst,1)});
    rs.forEach(r=>add(b2c,gstOfReturn(r),-1));
    S.purchases.filter(p=>inRange(p.date)).forEach(p=>p.rows.forEach(r=>{const l=purLine(r),k=+r.gst;pi[k]=pi[k]||{tx:0,tax:0};pi[k].tx+=l.base;pi[k].tax+=l.tax}));
    const tb=(o,t)=>{const rr=Object.keys(o).sort((a,b)=>a-b);const T=rr.reduce((a,r)=>({tx:a.tx+o[r].tx,tax:a.tax+o[r].tax}),{tx:0,tax:0});
      return`<h3>${t}</h3><div class="tw"><table class="t"><thead><tr><th>GST rate</th><th class="r">Taxable value</th><th class="r">CGST</th><th class="r">SGST</th><th class="r">Total GST</th></tr></thead><tbody>${rr.map(r=>`<tr><td>${r}%</td><td class="r">${n2(o[r].tx)}</td><td class="r">${n2(o[r].tax/2)}</td><td class="r">${n2(o[r].tax/2)}</td><td class="r">${n2(o[r].tax)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nothing in these dates.</td></tr>'}</tbody>
      <tfoot><tr><td>Total</td><td class="r">${n2(T.tx)}</td><td class="r">${n2(T.tax/2)}</td><td class="r">${n2(T.tax/2)}</td><td class="r">${n2(T.tax)}</td></tr></tfoot></table></div>`};
    const b2bTax=b2b.reduce((a,{s})=>a+Object.values(s.gst).reduce((x,v)=>x+v.tax,0),0);
    const out=Object.values(b2c).reduce((a,v)=>a+v.tax,0)+b2bTax,inp=Object.values(pi).reduce((a,v)=>a+v.tax,0);
    h=`<h3>B2B sales (customers with GSTIN)</h3>${b2b.length?`<div class="tw"><table class="t"><thead><tr><th>Bill</th><th>Date</th><th>Customer</th><th>GSTIN</th><th class="r">Taxable</th><th class="r">GST</th><th class="r">Total</th></tr></thead><tbody>${b2b.map(({s,p})=>{const tx=Object.values(s.gst).reduce((a,v)=>a+v.tx,0);return`<tr><td>${esc(s.no)}</td><td>${dmy(s.date)}</td><td>${esc(p.name)}</td><td>${esc(p.gstin)}</td><td class="r">${n2(tx)}</td><td class="r">${n2(s.total-s.ro-tx)}</td><td class="r">${n2(s.total)}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="note">No B2B bills in these dates. Add a GSTIN to a customer to bill them as B2B.</p>'}
      ${tb(b2c,'B2C sales by rate (after returns)')}${tb(pi,'Purchases (input GST credit)')}<p style="font-size:17px;margin:0">Estimated GST payable: <b>${money(Math.max(0,out-inp))}</b>${inp>out?` · credit carried forward ${money(inp-out)}`:''}</p><p class="note">For GSTR-1 and GSTR-3B. Please confirm with your accountant before filing.</p>`}}
  if(rtab==='h1'){const rows=[];S.sales.filter(s=>inRange(s.date)&&!s.cancelled).forEach(s=>s.items.forEach(i=>{if(i.sched==='H1'||i.sched==='X')rows.push({s,i})}));
    h=rows.length?`<div class="tw"><table class="t"><thead><tr><th>Date</th><th>Bill</th><th>Patient</th><th>Doctor</th><th>Medicine</th><th>Batch</th><th class="r">Qty</th></tr></thead><tbody>${rows.map(({s,i})=>`<tr><td>${dmy(s.date)}</td><td>${esc(s.no)}</td><td>${esc(s.name)}</td><td>${esc(s.doctor)}</td><td>${esc(i.name)} <span class="chip warn">${i.sched}</span></td><td>${esc(i.batch)}</td><td class="r">${qtyLabel(i)}</td></tr>`).join('')}</tbody></table></div>
      <div class="row"><button class="btn" data-act="printH1">Print register</button><span class="note">Keep this register for the drug inspector. Schedule H1 bills need the patient and doctor name.</span></div>`:'<div class="empty">No Schedule H1 or X medicines sold in these dates.</div>'}
  if(rtab==='expiry'){const l=expiryList();
    h=l.length?`<div class="tw"><table class="t"><thead><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th class="r">Qty</th><th class="r">Value (pur. rate)</th></tr></thead><tbody>${l.map(b=>{const m=med(b.medId);return`<tr><td>${esc(m?m.name:'')}</td><td>${esc(b.batch)}</td><td><span class="chip ${isExpired(b.exp)?'bad':'warn'}">${isExpired(b.exp)?'Expired ':''}${expF(b.exp)}</span></td><td class="r">${fmtStock(b.qty,m)}</td><td class="r">${n2(b.qty*(b.pur||0))}</td></tr>`}).join('')}</tbody>
    <tfoot><tr><td>Total</td><td></td><td></td><td></td><td class="r">${n2(l.reduce((a,b)=>a+b.qty*(b.pur||0),0))}</td></tr></tfoot></table></div><p class="note">Expired batches are blocked from billing. Return them to the supplier and set their quantity to 0 in Medicines.</p>`:'<div class="empty">No batches expiring in the next 3 months.</div>'}
  if(rtab==='low'){const l=lowStock();
    h=l.length?`<div class="tw"><table class="t"><thead><tr><th>Medicine</th><th>Company</th><th class="r">In stock</th><th class="r">Reorder level</th></tr></thead><tbody>${l.map(m=>{const s=stockOf(m.id);return`<tr><td>${esc(m.name)}<div class="sub">${esc(m.pack)}</div></td><td>${esc(m.company)}</td><td class="r">${s>0?fmtStock(s,m):'<span class="chip bad">0</span>'}</td><td class="r">${m.min||0}</td></tr>`}).join('')}</tbody></table></div><p class="note">Use this as your order list (shortbook) for the distributor.</p>`:'<div class="empty">Nothing to reorder.</div>'}
  if(rtab==='log'){const l=[...(S.log||[])].reverse().slice(0,200);
    h=l.length?`<div class="tw"><table class="t"><thead><tr><th>When</th><th>What happened</th></tr></thead><tbody>${l.map(e=>`<tr><td class="sub" style="white-space:nowrap">${new Date(e.t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(e.text)}</td></tr>`).join('')}</tbody></table></div><p class="note">Bill edits, cancellations, returns, stock corrections and setting changes are recorded here.</p>`:'<div class="empty">Nothing recorded yet.</div>'}
  $('#rbody').innerHTML=h;
}

 <div class="stack">
 <div class="card stack"><h3>Shop details</h3><div class="form">

  <label>Theme<select id="s_theme">${Object.entries(THEME_LABEL).map(([v,l])=>`<option value="${v}" ${(s.theme||'auto')===v?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>Text size on screen<select id="s_large"><option value="">Normal</option><option value="1" ${s.large?'selected':''}>Large (easier to read)</option></select></label>
  <label class="wide">Footer note on bill<input id="s_footer" value="${esc(s.footer)}"></label></div>
  <p class="note">Bill numbers can only move forward${used?` (the last bill used no. ${used})`:''}, so two bills never share a number.</p>
  <div><button class="btn pri" data-act="saveSettings">Save settings</button></div></div>
 <div class="card stack"><h3>Backup</h3>
  <p class="note">Your records are kept in this browser on this computer, with a copy of each of the last 7 days. For safety, also keep a copy outside the browser.</p>
  <div class="row"><button class="btn pri" data-act="pickFolder">${dirHandle?'Change auto backup folder':'Set up auto backup folder'}</button><span class="note">${dirHandle?(backupState==='on'?'Auto backup is on. A file is saved to your folder after every change, one file per day.':'Auto backup is paused. Press "Resume backup" in the menu.'):'Chrome or Edge on a computer: choose a folder (a pen drive or your Google Drive folder works well) and a backup file is saved there automatically.'}</span></div>
  <div class="row"><button class="btn" data-act="backup">Download backup now</button><label class="btn" style="display:inline-block">Restore from backup file<input id="restore" type="file" accept=".json,application/json" hidden></label><span class="note">Last backup: ${timeAgo(lastBackup)}</span></div>
  <h3 style="margin-top:6px">Daily copies in this browser</h3><div id="snaps" class="note">Loading…</div></div>
 <div class="card stack"><h3>Start fresh</h3><p class="note">Deletes all medicines, bills, customers and purchases. Shop details are kept. Download a backup first.</p><div><button class="btn danger" data-act="wipe">Delete all data</button></div></div>
 </div>`};
AFTER.settings=()=>{
  $('#restore').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.meds||!d.sales)throw 0;S=d;migrate();logEv('Data restored from backup file '+f.name);save();render();toast('Backup restored.')}catch(x){toast('That file is not a Pharmacy Counter backup.')}};r.readAsText(f)});
  (async()=>{const el=$('#snaps');if(!el)return;if(!idb){el.textContent='Not available in this browser.';return}
    try{const keys=(await idbKeys()).map(String).filter(k=>k.startsWith(SNAP)).sort().reverse();
      el.innerHTML=keys.length?`<div class="tw"><table class="t"><tbody>${keys.map(k=>`<tr><td>Start of ${dmy(k.slice(-10))}</td><td class="r"><button class="btn sm" data-act="restoreSnap" data-k="${k}">Restore this day</button></td></tr>`).join('')}</tbody></table></div>`:'No daily copies yet.'}catch(e){el.textContent='Could not read daily copies.'}})();
};

function billTitle(){const st=S.settings;if(st.title!=='auto')return st.title;return st.gstType==='composition'?'BILL OF SUPPLY':st.gstType==='unregistered'?'CASH MEMO':(st.gstin?'TAX INVOICE':'ESTIMATE')}
function invoiceHTML(s){
  const st=S.settings,p=party(s.partyId),showGst=gstOn();
  if(st.paper==='80mm'||st.paper==='58mm')return receiptHTML(s);
  const gst=Object.entries(s.gst||{}).filter(([,v])=>v.tax>0.001).sort((a,b)=>a[0]-b[0]);
  const curr=(s.prevBal||0)+s.total-(s.paid||0);
  return`<div class="inv">
  <div class="ih"><div><div class="shop">${esc(st.shop)}</div><div>${esc(st.addr)}</div><div>${st.phone?'Ph: '+esc(st.phone):''}${st.gstin?' &nbsp;|&nbsp; GSTIN: '+esc(st.gstin):''}${st.dl?' &nbsp;|&nbsp; D.L. No: '+esc(st.dl):''}</div></div>
   <div class="ttl">${esc(billTitle())}<small>( ${s.type.toUpperCase()} )</small></div></div>
  <div class="im"><div>Patient : <b>${esc(s.name.toUpperCase())}</b>${s.phone?'<br>Phone : '+esc(s.phone):''}${p&&p.gstin?'<br>Customer GSTIN : '+esc(p.gstin):''}${s.doctor?'<br>Dr. : '+esc(s.doctor):''}</div><div class="r">Bill No : <b>${esc(s.no)}</b><br>Date : ${dmy(s.date)}</div></div>
  <table class="it"><thead><tr><th>Sr</th><th class="l">Product</th>${showGst?'<th class="l">HSN</th>':''}<th class="l">Batch</th><th>Exp</th><th>Qty</th><th>MRP</th><th>Rate</th><th>Dis%</th>${showGst?'<th>GST%</th>':''}<th>Amount</th></tr></thead><tbody>
  ${s.items.map((it,i)=>`<tr><td>${i+1}</td><td class="l">${esc(it.name)}${it.sched?' *'+it.sched:''}</td>${showGst?`<td class="l">${esc(it.hsn||'')}</td>`:''}<td class="l">${esc(it.batch)}</td><td>${expF(it.exp)}</td><td>${qtyLabel(it)}</td><td>${n2(it.mrp)}</td><td>${n2(it.rate)}</td><td>${it.disc?n2(it.disc):''}</td>${showGst?`<td>${it.gst}</td>`:''}<td>${n2(lineAmt(it))}</td></tr>`).join('')}
  <tr class="fill" style="--fh:${Math.max(20,180-s.items.length*16)}px">${'<td></td>'.repeat(showGst?11:9)}</tr></tbody></table>
  <div class="iw">${words(s.total)}</div>
  <div class="if"><div>${showGst&&gst.length?`<table class="gt"><thead><tr><th>GST%</th><th>Taxable</th><th>CGST</th><th>SGST</th></tr></thead><tbody>${gst.map(([r,v])=>`<tr><td>${r}</td><td>${n2(v.tx)}</td><td>${n2(v.tax/2)}</td><td>${n2(v.tax/2)}</td></tr>`).join('')}</tbody></table>`:''}
    ${st.gstType==='composition'?'<div style="margin-top:4px">Composition taxable person, not eligible to collect tax on supplies.</div>':''}
    ${s.partyId&&(s.type==='Credit'||s.prevBal)?`<div style="margin-top:6px">Prev. Bal : ${n2(s.prevBal)} &nbsp; Paid : ${n2(s.paid)}<br><b>Curr. Bal : ${n2(curr)}</b></div>`:''}</div>
   <div class="tot"><span>Sub Total :</span><span>${n2(s.sub)}</span><span>Discount :</span><span>${n2(s.disc)}</span><span>Round Off :</span><span>${n2(s.ro)}</span><span class="g">Grand Total :</span><span class="g">${n2(s.total)}</span></div></div>
  <div class="is"><div>${esc(st.footer)}</div><div style="text-align:center;white-space:nowrap">For ${esc(st.shop)}<br><br>Authorised Signatory</div></div></div>`;
}
function receiptHTML(s){
  const st=S.settings,p=party(s.partyId),gst=Object.entries(s.gst||{}).filter(([,v])=>v.tax>0.001),curr=(s.prevBal||0)+s.total-(s.paid||0);
  return`<div class="rc ${st.paper==='58mm'?'w58':''}"><div class="c"><div class="sh">${esc(st.shop)}</div><div>${esc(st.addr)}</div>${st.phone?`<div>Ph: ${esc(st.phone)}</div>`:''}${st.gstin?`<div>GSTIN: ${esc(st.gstin)}</div>`:''}${st.dl?`<div>DL: ${esc(st.dl)}</div>`:''}<div style="margin-top:3px"><b>${esc(billTitle())}</b> (${s.type.toUpperCase()})</div></div><hr>
  <div class="ln"><span>Bill: ${esc(s.no)}</span><span>${dmy(s.date)}</span></div><div>Patient: ${esc(s.name)}</div>${p&&p.gstin?`<div>GSTIN: ${esc(p.gstin)}</div>`:''}${s.doctor?`<div>Dr: ${esc(s.doctor)}</div>`:''}<hr>
  ${s.items.map(it=>`<div><b>${esc(it.name)}</b></div><div class="ln s"><span>${esc(it.batch)} · ${expF(it.exp)} · ${qtyLabel(it)} × ${n2(it.rate)}${it.disc?' -'+it.disc+'%':''}</span><span>${n2(lineAmt(it))}</span></div>`).join('')}<hr>
  <div class="ln"><span>Sub total</span><span>${n2(s.sub)}</span></div>${s.disc?`<div class="ln"><span>Discount</span><span>-${n2(s.disc)}</span></div>`:''}<div class="ln"><span>Round off</span><span>${n2(s.ro)}</span></div>
  <div class="ln g"><span>TOTAL</span><span>₹${n2(s.total)}</span></div>
  ${gstOn()&&gst.length?`<div class="s">${gst.map(([r,v])=>`GST ${r}%: taxable ${n2(v.tx)}, CGST ${n2(v.tax/2)}, SGST ${n2(v.tax/2)}`).join('<br>')}</div>`:''}
  ${s.partyId&&(s.type==='Credit'||s.prevBal)?`<hr><div class="ln"><span>Prev. bal</span><span>${n2(s.prevBal)}</span></div><div class="ln"><span>Paid</span><span>${n2(s.paid)}</span></div><div class="ln"><b>Curr. bal</b><b>${n2(curr)}</b></div>`:''}
  <hr><div class="c s">${esc(st.footer)}</div></div>`;
}
function waText(s){const st=S.settings,curr=(s.prevBal||0)+s.total-(s.paid||0);let t=`*${st.shop}*\nBill ${s.no} · ${dmy(s.date)}\n\n`;
  s.items.forEach(i=>t+=`${i.name} × ${qtyLabel(i)} = ₹${n2(lineAmt(i))}\n`);if(s.disc)t+=`Discount: -₹${n2(s.disc)}\n`;
  t+=`\n*Total: ₹${n2(s.total)}*\n`;if(s.partyId&&s.type==='Credit')t+=`Balance due: ₹${n2(curr)}\n`;return t+`\n${st.footer}`}
function showBill(id,fresh){const s=S.sales.find(x=>x.id===id);if(!s)return;
  const hasRet=S.returns.some(r=>r.saleId===s.id),ph=phone91(s.phone||(party(s.partyId)||{}).phone);
  modal(`<div class="row" style="justify-content:space-between;padding-right:30px">${fresh?`<div class="banner info" style="margin:0 30px 0 0"><span><b>Saved.</b> Bill ${esc(s.no)} for ${money(s.total)}${s.type==='Credit'?' added to udhaar':''}.</span></div>`:''}<h2>Bill ${esc(s.no)}${s.cancelled?' <span class="chip bad">Cancelled</span>':''}${hasRet?' <span class="chip warn">Has returns</span>':''}</h2>
   <div class="row">${fresh?'<button class="btn pri" data-act="close">Next bill (Enter)</button>':''}<button class="btn ${fresh?'':'pri'}" data-act="print" data-id="${id}">Print</button>${ph?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${encodeURIComponent(waText(s))}">Send on WhatsApp</a>`:''}</div></div>
   ${s.cancelled?'':`<div class="row"><button class="btn sm" data-act="editBill" data-id="${id}" ${hasRet?'disabled title="Bills with returns cannot be edited"':''}>Edit bill</button><button class="btn sm" data-act="returnForm" data-id="${id}">Return items</button><button class="btn sm danger" data-act="cancelBill" data-id="${id}">Cancel bill</button>${hasRet?'<span class="note">Bills with returns cannot be edited or cancelled.</span>':''}</div>`}
   <div class="paper">${invoiceHTML(s)}</div>`,true)}
function doPrint(html){
  const p=S.settings.paper;$('#printArea').innerHTML=html;
  $('#pagesize').textContent=p==='A4'||p==='A5'?`@page{size:${p} portrait;margin:7mm}`:'@page{margin:2mm}';
  if(inFrame){saveFile('bill-print.html',printableDoc(html),'text/html').then(ok=>{if(ok)toast('Bill saved. Open the file: the print window opens by itself.')});return}
  setTimeout(()=>{try{window.print()}catch(e){}},60);
}
function returnFormHTML(s){
  return`<h2>Return items from bill ${esc(s.no)}</h2><p class="note">Enter how many of each item came back. Stock goes back to the same batch.</p>
  <div class="tw"><table class="t"><thead><tr><th>Medicine</th><th class="r">Sold</th><th class="r">Already returned</th><th class="r">Return now</th></tr></thead><tbody>${s.items.map((it,i)=>{const done=returnedQty(s,i),left=it.qty-done;
    return`<tr><td>${esc(it.name)}<div class="sub">Batch ${esc(it.batch)} · ${n2(it.rate)} each</div></td><td class="r">${qtyLabel(it)}</td><td class="r">${done}</td><td class="r"><input id="rq_${i}" data-idx="${i}" type="number" min="0" max="${left}" step="1" value="0" style="width:80px" ${left<=0?'disabled':''} aria-label="Return quantity"></td></tr>`}).join('')}</tbody></table></div>
  <div class="form"><label>Refund<select id="r_mode">${s.partyId&&s.type==='Credit'?'<option value="credit">Reduce udhaar balance</option><option value="cash">Cash refund</option>':'<option value="cash">Cash refund</option>'+(s.partyId?'<option value="credit">Reduce udhaar balance</option>':'')}</select></label><label>Date<input id="r_date" type="date" max="${today()}" value="${today()}"></label></div>
  <div class="mfoot"><button class="btn pri" data-act="saveReturn" data-id="${s.id}">Save return</button></div>`}

  saveSettings:()=>{const s=S.settings,used=maxBillNo($('#s_prefix').value.trim());const nn=parseInt($('#s_nextNo').value)||1;
    if(nn<=used)return toast(`Next bill no. must be more than ${used}, the last bill number used.`);
    const gi=$('#s_gstin').value.trim().toUpperCase();if(gi&&!/^[0-9]{2}[A-Z0-9]{13}$/.test(gi))return toast('GSTIN should be 15 characters, starting with the 2-digit state code.');
    if($('#s_gstType').value==='regular'&&!gi)toast('Regular GST is selected but no GSTIN is entered. Bills will print as ESTIMATE until you add it.');
    const before=JSON.stringify(s);['shop','addr','phone','dl','title','paper','prefix','footer','gstType','large','theme','stock'].forEach(k=>s[k]=$('#s_'+k).value.trim());s.gstin=gi;s.nextNo=nn;
    if(before!==JSON.stringify(s))logEv('Settings changed');save();render();if(!( $('#s_gstType').value==='regular'&&!gi))toast('Settings saved.')},
  backup:async()=>{if(await saveFile(`pharmacy-backup-${today()}.json`,JSON.stringify(S),'application/json')){markBackup();toast('Backup saved. Keep it on a pen drive or in Google Drive.')}},
  pickFolder:async()=>{if(!window.showDirectoryPicker)return toast('This browser cannot save to a folder automatically. Use Chrome or Edge on a computer, or use Download backup.');
    try{dirHandle=await window.showDirectoryPicker({mode:'readwrite'});if(idb)await idbSet('dir',dirHandle);await writeBackupFile();backupState='on';logEv('Auto backup folder set: '+dirHandle.name);save();render();toast(`Auto backup is on. Files are saved in “${dirHandle.name}”.`)}
    catch(e){if(e&&e.name!=='AbortError')toast('Could not use that folder. Try another folder, or use Download backup.')}},
  resumeBackup:async()=>{try{const p=await dirHandle.requestPermission({mode:'readwrite'});if(p==='granted'){await writeBackupFile();backupState='on';toast('Auto backup resumed.')}else toast('Backup stays paused until you allow it.')}catch(e){toast('Could not reach the backup folder. Choose it again in Settings.')}drawNav()},
  restoreSnap:async b=>{if(!armed(b))return;try{const d=await idbGet(b.dataset.k);if(!d)throw 0;S=d;migrate();logEv('Restored daily copy from '+dmy(b.dataset.k.slice(-10)));save();render();toast('Records restored to the start of '+dmy(b.dataset.k.slice(-10))+'.')}catch(e){toast('Could not restore that copy.')}},
  wipe:b=>{if(!armed(b))return;const st=S.settings;S=blankState();S.settings=st;S.settings.nextNo=1;S.settings.cnNo=1;logEv('All data deleted');save();render();toast('All data deleted.')},
  clearSample:b=>{if(!armed(b))return;const st=S.settings;S=blankState();S.settings={...st,nextNo:1,cnNo:1,welcomed:true};logEv('Sample data removed');save();go(st.setupDone?'home':'setup');toast('Sample data removed. Add your medicines or enter a purchase to begin.')},
};
document.addEventListener('click',e=>{
  if(!S)return;
  if(e.target.id==='modal'){closeModal();return}
  const g=e.target.closest('[data-go]');if(g){if(g.dataset.tab)rtab=g.dataset.tab;closeModal();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a,e);
});
document.addEventListener('keydown',e=>{
  if(!S)return;
  if(e.key==='Escape'&&!$('#modal').hidden){A.close();return}
  if(e.key==='Enter'&&!$('#modal').hidden&&$('#modal .banner.info')&&!e.target.closest('input,select,button,a')){e.preventDefault();A.close();return}
  const k={F2:'bill',F3:'purchase',F6:'meds'}[e.key];
  if(k){e.preventDefault();closeModal();go(k);return}
  if(e.key==='F4'&&view==='bill'){e.preventDefault();$('#medsearch').focus()}
  if(e.key==='F10'&&view==='bill'&&$('#modal').hidden){e.preventDefault();saveBill(true)}
});

/* ================= start ================= */
(async function init(){
  try{idb=await idbOpen()}catch(e){idb=null}
  let d=null,migrated=false,fresh=false;
  if(CLOUD){
    const sess=PCCloud.session();
    if(!sess||!sess.user){location.replace('../login.html?next=app');return}
    const u=sess.user;STATE_KEY='state:'+u.id;SNAP=u.id+':snap-';
    if(idb){try{d=await idbGet(STATE_KEY);lastBackup=(await idbGet(STATE_KEY+':lastBackup'))||null;dirHandle=(await idbGet('dir'))||null}catch(e){}}
    let remote=null,online=true;
    try{remote=await PCCloud.getShopData()}catch(e){online=false;if(e.status===401)cloudStatus={state:'login',msg:'Please log in again to keep saving to the cloud.'}}
    if(remote&&remote.data&&remote.data.meds){
      if(!d)d=Object.assign(remote.data,{sync:{at:remote.updated_at,dirty:false}});
      else if(!d.sync||!d.sync.at||Date.parse(remote.updated_at)>Date.parse(d.sync.at)){
        const merged=d.sync&&d.sync.dirty?mergeStates(d,remote.data):remote.data;d=Object.assign(merged,{sync:{...(d.sync||{}),at:remote.updated_at,dirty:!!(d.sync&&d.sync.dirty)}})}
    }else if(!d&&online&&idb){
      // first login on this device: bring over records made before accounts existed
      try{const old=await idbGet('state');if(old&&old.meds&&!old.sample){d=old;d.sync={dirty:true};migrated=true}}catch(e){}
    }
    if(!d){fresh=true;S=blankState();const m=u.user_metadata||{};S.settings.shop=m.shop_name||S.settings.shop;if(m.phone)S.settings.phone=m.phone;
      if(m.city)S.settings.addr=m.city;S.settings.welcomed=true;S.sync={dirty:true};logEv('Account created')}
    else{S=d;migrate();if(migrated)logEv('Records from this computer added to your account')}
    if(!online&&cloudStatus.state!=='login')cloudStatus={state:'offline',msg:''};
  }else{
    if(idb){try{d=await idbGet('state');lastBackup=(await idbGet('lastBackup'))||null;dirHandle=(await idbGet('dir'))||null}catch(e){}}
    if(!d){try{const v=localStorage.getItem(LEGACY_KEY);if(v){d=JSON.parse(v);migrated=true}}catch(e){}}
    if(d&&d.meds){S=d;migrate();if(migrated)logEv('Records moved to the new storage')}else seed();
  }
  if(fresh)view='setup';
  if(dirHandle)backupState='paused';
  save();
  try{await snapshotToday()}catch(e){}
  render();
  if(S.sample&&!S.settings.welcomed)modal(`<h2>Welcome to Pharmacy Counter</h2><p class="note">Free billing, stock and udhaar for your medical shop.</p><div class="welcome"><button data-act="startOwn"><b>Start with my shop</b><span class="note">Set up your shop name, GST and printer, then add stock.</span></button><button data-act="trySample"><b>Look around first</b><span class="note">Try it with sample medicines and bills. Remove them anytime.</span></button></div>`);
  if(dirHandle)autoBackup();
  if(CLOUD)setTimeout(()=>cloudSync(!!(S.sync&&S.sync.dirty)),1500);
  if(migrated&&CLOUD)toast('Records from this computer were added to your account.');
  setTimeout(loadCatalog,800);
})();
</script>
